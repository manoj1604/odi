[package]
name = "odi"
description = "Build, check, run and share ODI files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["odi", "deploy", "packaging", "serverless", "build"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
odi-format = { path = "../format", version = "0.2.1" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
cap-std = "3"
percent-encoding = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
bytes = "1"
ed25519-dalek = "2"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false }
