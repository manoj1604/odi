# Tests on Linux and macOS: the FUSE mount (odi run NAME) only compiles on Linux.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt", targets: wasm32-unknown-unknown }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --check
      # The command reference is made from odi's help: it must match.
      - run: sh docs/gen-cli.sh && git diff --exit-code docs/cli.md
      - run: sh -n install.sh
      # The hub workflow end to end, against the mock hub.
      - run: tests/hub.sh
      # cd into ODI files in zsh, bash and fish (and, on Linux, through FUSE).
      - name: shells for the cd test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish fuse3
          else
            brew install fish >/dev/null
          fi
      - run: tests/cd.sh
      # The browser runner's reader alone: pure Rust (ruzstd), as in a tab.
      - run: cargo test -p odi-web
      - run: cargo clippy -p odi-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p odi-web --release --target wasm32-unknown-unknown
      # The WebGPU example's game core (its own crate, WebAssembly only).
      - run: cargo clippy --release --target wasm32-unknown-unknown --manifest-path examples/starseed/core/Cargo.toml -- -D warnings
