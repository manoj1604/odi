# A release: pushing a tag v0.1.0 builds odi for Linux (static, musl) and
# macOS, x86_64 and arm64, plus the browser runner, and makes a draft GitHub
# release with them and SHA256SUMS. Publish the draft by hand once checked.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to build (it must exist)"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          # (Intel macOS: cross-built on an Apple silicon runner.)
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: The tag matches the version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG, but Cargo.toml says $v"; exit 1; }
      - name: Build
        shell: bash
        run: |
          export ODI_COMMIT=$(git rev-parse HEAD)
          t=${{ matrix.target }}
          case $t in *musl) export CC_${t//-/_}=musl-gcc ;; esac
          cargo build -p odi --release --locked --target "$t"
      - name: Package
        shell: bash
        run: |
          name=odi-$TAG-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/odi README.md LICENSE CHANGELOG.md "dist/$name/"
          "dist/$name/odi" version || true   # (an Intel build on Apple silicon may not run here)
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.target }}", path: "dist/*.tar.gz" }

  runner:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: The browser runner (web/), its wasm built from this tag
        run: |
          sh web/build.sh
          mkdir -p dist/odi-web-$TAG
          cp web/index.html web/sw.js web/odi.js web/odi_web.wasm dist/odi-web-$TAG/
          tar -C dist -czf dist/odi-web-$TAG.tar.gz odi-web-$TAG
      - uses: actions/upload-artifact@v4
        with: { name: runner, path: "dist/*.tar.gz" }

  release:
    needs: [build, runner]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Notes, from CHANGELOG.md's section for this version
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: A draft release (published by hand)
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS install.sh \
            --draft --title "odi $TAG" --notes-file notes.md \
            $(case "$TAG" in *-*) echo --prerelease ;; esac)
